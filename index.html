<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteBuddy</title>
  <style>
    :root {
  --bg: #0f172a;
  --card: rgba(255, 255, 255, 0.08);
  --primary: #38bdf8;
  --primary-dark: #0ea5e9;
  --text: #f8fafc;
  --muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.1);
  --success: #22c55e;
  --danger: #ef4444;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, "Segoe UI", sans-serif;
}

body {
  background:
    radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */

header {
  padding: 25px 20px;
  text-align: center;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 1px;
}

/* NAVIGATION */

nav {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 18px;
  flex-wrap: wrap;
}

nav button {
  border: none;
  padding: 12px 18px;
  border-radius: 14px;
  background: var(--card);
  color: white;
  cursor: pointer;
  transition: 0.25s ease;
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  font-weight: 600;
}

nav button:hover {
  transform: translateY(-3px);
  background: var(--primary);
  box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25);
}

/* CONTAINER */

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

/* CARD SECTIONS */

#add,
#track,
#delete {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px;
  backdrop-filter: blur(16px);
  box-shadow:
    0 10px 30px rgba(0,0,0,0.35);
}

h2 {
  margin-bottom: 20px;
  font-size: 1.8rem;
}

h3 {
  margin-bottom: 10px;
  margin-top: 25px;
}

/* FORM */

form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: white;
  outline: none;
  transition: 0.25s ease;
  font-size: 15px;
}

input::placeholder {
  color: var(--muted);
}

input:focus,
select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(56,189,248,0.15);
}

/* BUTTON */

.cta {
  border: none;
  padding: 14px;
  border-radius: 14px;
  background: linear-gradient(
    135deg,
    var(--primary),
    var(--primary-dark)
  );
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s ease;
  font-size: 15px;
}

.cta:hover {
  transform: translateY(-2px);
  box-shadow:
    0 12px 25px rgba(56,189,248,0.25);
}

/* RESULT CARD */

.result {
  margin-top: 20px;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  line-height: 1.9;
}

/* FOOD LIST */

.food-list ul {
  margin-top: 10px;
  list-style: none;
}

.food-list li {
  background: rgba(255,255,255,0.05);
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  color: #e2e8f0;
}

/* MESSAGE */

.message {
  margin-top: 18px;
  font-weight: 600;
  transition: opacity 0.4s ease;
}

/* HIDDEN */

.hidden {
  display: none;
}

/* MOBILE */

@media (max-width: 768px) {

  header h1 {
    font-size: 1.7rem;
  }

  nav {
    gap: 10px;
  }

  nav button {
    width: 100%;
  }

  #add,
  #track,
  #delete {
    padding: 20px;
    border-radius: 20px;
  }

  h2 {
    font-size: 1.5rem;
  }

  input,
  select,
  .cta {
    padding: 13px;
  }
}
  </style>
</head>

<body>
  <header>
    <h1>BiteBuddy</h1>
  </header>
  <nav>
    <button onclick="showPage('add')">Add Food</button>
    <button onclick="showPage('track')">Track Nutrition</button>
    <button onclick="showPage('delete')">Delete Food</button>
  </nav>
  <div class="container">

    <!-- Add Food -->
    <div id="add">
      <h2>Add Food</h2>
      <form id="addFoodForm">
        <input type="text" id="foodName" placeholder="Food Name" required />
        <input type="number" id="calories" placeholder="Calories per 100g" required />
        <input type="number" id="protein" placeholder="Protein (g) per 100g" required />
        <input type="number" id="carbs" placeholder="Carbs (g) per 100g" required />
        <input type="number" id="fat" placeholder="Fat (g) per 100g" required />
        <button type="submit" class="cta">Save Food</button>
      </form>
      <div id="messageBox" class="message"></div>
    </div>

    <!-- Track Nutrition -->
    <div id="track" class="hidden">
      <h2>Track Nutrition</h2>
      <select id="selectFood"></select>
      <input type="number" id="quantity" placeholder="Quantity in grams" />
      <button onclick="calculateNutrition()" class="cta">Calculate</button>
      <div class="result" id="result"></div>
    </div>

    <!-- Delete Food -->
    <div id="delete" class="hidden">
      <h2>Delete Saved Food</h2>
      <select id="deleteSelect"></select>
      <button onclick="deleteFood()" class="cta">Delete</button>
      <div class="food-list">
        <h3>Saved Foods:</h3>
        <ul id="foodList"></ul>
      </div>
    </div>

  </div>

  <script>
    const foodForm = document.getElementById('addFoodForm');
    const foodList = document.getElementById('foodList');
    const selectFood = document.getElementById('selectFood');
    const deleteSelect = document.getElementById('deleteSelect');
    const messageBox = document.getElementById('messageBox');
    let foods = JSON.parse(localStorage.getItem('foods')) || [];

    function showPage(page) {
      document.getElementById('add').classList.add('hidden');
      document.getElementById('track').classList.add('hidden');
      document.getElementById('delete').classList.add('hidden');
      document.getElementById(page).classList.remove('hidden');
      renderFoods();
    }

    function renderFoods() {
      // Populate tracking dropdown
      selectFood.innerHTML = '';
      foods.forEach((food, index) => {
        selectFood.innerHTML += `<option value="${index}">${food.name}</option>`;
      });

      // Populate delete dropdown and list
      deleteSelect.innerHTML = '';
      foodList.innerHTML = '';
      foods.forEach((food, index) => {
        deleteSelect.innerHTML += `<option value="${index}">${food.name}</option>`;
        foodList.innerHTML += `<li>${food.name} (100g): ${food.calories} kcal, ${food.protein}g P, ${food.carbs}g C, ${food.fat}g F</li>`;
      });
    }

    function showMessage(text, color) {
      messageBox.style.color = color;
      messageBox.textContent = text;
      messageBox.style.opacity = "1";
      setTimeout(() => {
        messageBox.style.opacity = "0";
      }, 3000);
    }

    foodForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const newName = foodForm.foodName.value.trim().toLowerCase();
      const duplicate = foods.some(food => food.name.toLowerCase() === newName);

      if (duplicate) {
        showMessage("Food already exists", "#ff6b6b");
        return;
      }

      const food = {
        name: foodForm.foodName.value.trim(),
        calories: parseFloat(foodForm.calories.value),
        protein: parseFloat(foodForm.protein.value),
        carbs: parseFloat(foodForm.carbs.value),
        fat: parseFloat(foodForm.fat.value)
      };
      foods.push(food);
      localStorage.setItem('foods', JSON.stringify(foods));
      foodForm.reset();
      renderFoods();

      showMessage("New food added", "#00ff7f");
    });

    function calculateNutrition() {
      const index = selectFood.value;
      const quantity = parseFloat(document.getElementById('quantity').value);
      if (!foods[index] || isNaN(quantity)) return;
      const food = foods[index];
      const factor = quantity / 100;
      const result = `
        <strong>${food.name} (${quantity}g)</strong><br>
        Calories: ${(food.calories * factor).toFixed(2)} kcal<br>
        Protein: ${(food.protein * factor).toFixed(2)} g<br>
        Carbs: ${(food.carbs * factor).toFixed(2)} g<br>
        Fat: ${(food.fat * factor).toFixed(2)} g
      `;
      document.getElementById('result').innerHTML = result;
    }

    function deleteFood() {
      const index = deleteSelect.value;
      if (foods[index]) {
        foods.splice(index, 1);
        localStorage.setItem('foods', JSON.stringify(foods));
        renderFoods();
      }
    }

    // Initial load
    renderFoods();
  </script>
</body>

</html>
